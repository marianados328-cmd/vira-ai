<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRA.AI</title>

<style>
*{
  box-sizing:border-box;
    margin:0;
      padding:0;
      }

      body{
        font-family:Arial,sans-serif;
          background:#0b0b0f;
            color:#fff;
              min-height:100vh;
              }

              main{
                width:100%;
                  max-width:720px;
                    margin:auto;
                      padding:24px 16px 50px;
                      }

                      .logo{
                        text-align:center;
                          font-size:36px;
                            font-weight:900;
                              letter-spacing:3px;
                                margin-top:20px;
                                }

                                .logo span{
                                  color:#9b5cff;
                                  }

                                  .sub{
                                    text-align:center;
                                      color:#aaa;
                                        margin:8px 0 28px;
                                          font-size:15px;
                                          }

                                          .card{
                                            background:#15151c;
                                              border:1px solid #292936;
                                                border-radius:18px;
                                                  padding:20px;
                                                    margin-bottom:16px;
                                                    }

                                                    label{
                                                      display:block;
                                                        font-weight:bold;
                                                          margin-bottom:8px;
                                                          }

                                                          input,textarea,select{
                                                            width:100%;
                                                              background:#0d0d12;
                                                                color:#fff;
                                                                  border:1px solid #343442;
                                                                    border-radius:12px;
                                                                      padding:14px;
                                                                        margin-bottom:16px;
                                                                          font-size:15px;
                                                                          }

                                                                          textarea{
                                                                            min-height:100px;
                                                                              resize:vertical;
                                                                              }

                                                                              button{
                                                                                width:100%;
                                                                                  border:0;
                                                                                    border-radius:12px;
                                                                                      padding:15px;
                                                                                        background:#9b5cff;
                                                                                          color:white;
                                                                                            font-size:16px;
                                                                                              font-weight:bold;
                                                                                                cursor:pointer;
                                                                                                }

                                                                                                button:active{
                                                                                                  transform:scale(.98);
                                                                                                  }

                                                                                                  .resultado{
                                                                                                    display:none;
                                                                                                      margin-top:18px;
                                                                                                      }

                                                                                                      .item{
                                                                                                        background:#0d0d12;
                                                                                                          border:1px solid #30303b;
                                                                                                            border-radius:12px;
                                                                                                              padding:14px;
                                                                                                                margin-top:12px;
                                                                                                                }

                                                                                                                .item strong{
                                                                                                                  color:#b984ff;
                                                                                                                  }

                                                                                                                  .copy{
                                                                                                                    margin-top:10px;
                                                                                                                      background:#242431;
                                                                                                                        font-size:14px;
                                                                                                                        }

                                                                                                                        footer{
                                                                                                                          text-align:center;
                                                                                                                            color:#666;
                                                                                                                              font-size:12px;
                                                                                                                                margin-top:30px;
                                                                                                                                }
                                                                                                                                </style>
                                                                                                                                </head>

                                                                                                                                <body>

                                                                                                                                <main>

                                                                                                                                <div class="logo">
                                                                                                                                  VIRA<span>.AI</span>
                                                                                                                                  </div>

                                                                                                                                  <p class="sub">
                                                                                                                                    Transforme produtos em conteúdo que vende.
                                                                                                                                    </p>

                                                                                                                                    <div class="card">

                                                                                                                                    <label>🛍️ Nome do produto</label>

                                                                                                                                    <input
                                                                                                                                      id="produto"
                                                                                                                                        placeholder="Ex: Conjunto fitness feminino"
                                                                                                                                        >

                                                                                                                                        <label>💰 Preço</label>

                                                                                                                                        <input
                                                                                                                                          id="preco"
                                                                                                                                            placeholder="Ex: R$ 89,90"
                                                                                                                                            >

                                                                                                                                            <label>🎯 Onde você vai vender?</label>

                                                                                                                                            <select id="canal">
                                                                                                                                              <option>Instagram</option>
                                                                                                                                                <option>TikTok</option>
                                                                                                                                                  <option>WhatsApp</option>
                                                                                                                                                    <option>Shopee</option>
                                                                                                                                                    </select>

                                                                                                                                                    <label>📝 Informações do produto</label>

                                                                                                                                                    <textarea
                                                                                                                                                      id="info"
                                                                                                                                                        placeholder="Digite as principais características do produto..."
                                                                                                                                                        ></textarea>

                                                                                                                                                        <button onclick="gerar()">
                                                                                                                                                          ✨ GERAR CONTEÚDO
                                                                                                                                                          </button>

                                                                                                                                                          <div id="resultado" class="resultado">

                                                                                                                                                          <div class="item">
                                                                                                                                                          <strong>🔥 GANCHO</strong>
                                                                                                                                                          <p id="gancho"></p>
                                                                                                                                                          <button class="copy" onclick="copiar('gancho')">
                                                                                                                                                          Copiar
                                                                                                                                                          </button>
                                                                                                                                                          </div>

                                                                                                                                                          <div class="item">
                                                                                                                                                          <strong>📲 LEGENDA</strong>
                                                                                                                                                          <p id="legenda"></p>
                                                                                                                                                          <button class="copy" onclick="copiar('legenda')">
                                                                                                                                                          Copiar
                                                                                                                                                          </button>
                                                                                                                                                          </div>

                                                                                                                                                          <div class="item">
                                                                                                                                                          <strong>🎬 IDEIA DE VÍDEO</strong>
                                                                                                                                                          <p id="video"></p>
                                                                                                                                                          <button class="copy" onclick="copiar('video')">
                                                                                                                                                          Copiar
                                                                                                                                                          </button>
                                                                                                                                                          </div>

                                                                                                                                                          </div>

                                                                                                                                                          </div>

                                                                                                                                                          <footer>
                                                                                                                                                          VIRA.AI • Seu assistente de conteúdo
                                                                                                                                                          </footer>

                                                                                                                                                          </main>

                                                                                                                                                          <script>

                                                                                                                                                          function gerar(){

                                                                                                                                                            const produto =
                                                                                                                                                                document.getElementById("produto").value ||
                                                                                                                                                                    "seu produto";

                                                                                                                                                                      const preco =
                                                                                                                                                                          document.getElementById("preco").value ||
                                                                                                                                                                              "";

                                                                                                                                                                                const info =
                                                                                                                                                                                    document.getElementById("info").value ||
                                                                                                                                                                                        "prático, bonito e perfeito para o dia a dia";

                                                                                                                                                                                          document.getElementById("gancho").innerText =
                                                                                                                                                                                              "🚨 Você precisa conhecer " + produto + "!";

                                                                                                                                                                                                document.getElementById("legenda").innerText =
                                                                                                                                                                                                    "✨ " + produto +
                                                                                                                                                                                                        " que pode transformar sua rotina! " +
                                                                                                                                                                                                            info +
                                                                                                                                                                                                                ". " +
                                                                                                                                                                                                                    (preco ? "Por apenas " + preco + ". " : "") +
                                                                                                                                                                                                                        "💜 Aproveite e garanta o seu!";

                                                                                                                                                                                                                          document.getElementById("video").innerText =
                                                                                                                                                                                                                              "Comece mostrando o produto bem de perto. " +
                                                                                                                                                                                                                                  "Depois mostre como ele funciona ou fica no uso. " +
                                                                                                                                                                                                                                      "Finalize olhando para a câmera e dizendo: " +
                                                                                                                                                                                                                                          "“Você também precisa desse!”";

                                                                                                                                                                                                                                            document.getElementById("resultado").style.display =
                                                                                                                                                                                                                                                "block";

                                                                                                                                                                                                                                                  document.getElementById("resultado")
                                                                                                                                                                                                                                                      .scrollIntoView({
                                                                                                                                                                                                                                                            behavior:"smooth"
                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                function copiar(id){

                                                                                                                                                                                                                                                                  const texto =
                                                                                                                                                                                                                                                                      document.getElementById(id).innerText;

                                                                                                                                                                                                                                                                        navigator.clipboard.writeText(texto);

                                                                                                                                                                                                                                                                          alert("Copiado! 💜");
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                          </html>
